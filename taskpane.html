<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Search for Word</title><link rel="stylesheet" href="taskpane.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script></head>
<body><main class="app"><header><div class="logo">G</div><div><h1>Google Search for Word</h1><p>Google ва Google Scholar қидируви</p></div></header>
<label for="q">Қидирув сўрови</label><textarea id="q" rows="4" placeholder="Қидирув сўровини киритинг..."></textarea>
<div class="buttons"><button id="selection" class="secondary">Word'дан танланган матнни олиш</button><button id="web" class="primary">Google'да қидириш</button><button id="scholar" class="scholar">Google Scholar'да қидириш</button></div>
<p id="status" role="status"></p><footer>Қидирув натижалари браузерда очилади. Google Programmable Search Engine ID талаб қилинмайди.</footer></main><script src="taskpane.js"></script></body></html>
